name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # tools/gen_vectors.py imports yaml; PyYAML is not preinstalled on
      # GitHub runners and the image's system Python is externally managed.
      - name: Install PyYAML for the vector generator
        run: python3 -m pip install --user --break-system-packages pyyaml

      - name: gofmt check
        run: make fmt-check

      - name: go vet
        run: make vet

      - name: build
        run: make build

      - name: race tests
        run: make test

      - name: golden vector cross-check
        run: make vectors

      - name: slop gate
        run: make slop

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PyYAML for the site gates
        run: python3 -m pip install --user pyyaml

      - name: Site sync gate (spec/data mirrors and manifests fresh)
        run: python3 tools/sync_site_docs.py --check

      - name: Site integrity gate (front matter, links, nav, manifests)
        run: python3 tools/check_site.py

      - name: Jekyll build (same engine as the Pages deploy)
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

  worker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/mirage-worker/package-lock.json

      - name: Install worker dependencies
        run: cd packages/mirage-worker && npm ci

      - name: Build the worker
        run: cd packages/mirage-worker && npm run build

      - name: Test the worker
        run: cd packages/mirage-worker && npm test

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" role="img" aria-labelledby="mrg-arch-title mrg-arch-desc" style="width:100%;max-width:880px;height:auto;display:block;margin:4px auto 20px;font-family:var(--font-mono, ui-monospace, Menlo, Consolas, monospace)">
  <title id="mrg-arch-title">The Mirage decision path: client to adapter, engine, verdict ladder and action, then event to store and connectors.</title>
  <desc id="mrg-arch-desc">Horizontal lifecycle figure. The client request enters the adapter (edge or worker), which extracts request fields. The engine scores eleven signals against an in-memory session, the verdict ladder picks observe, tag, decoy_route, throttle or ban, and the adapter applies the action: pass, serve_decoy, throttle 429 or ban 403. The decision returns to the adapter under a 5 ms deadline and fails open on any error or overrun (I1): verdict observe, action pass, reason SIG-000. Events land on a bounded queue, drain to the SQLite WAL store, and fan out to the webhook, CrowdSec and Cloudflare connectors.</desc>

    <marker id="mrg-arch-arrow" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">

    </marker>
  </defs>

    .mrg-arch-t { font-size: 13px; font-weight: 700; letter-spacing: 0.05em; fill: var(--text-strong, #f2f6fc); }
    .mrg-arch-s { font-size: 12px; fill: var(--muted, #8fa0b8); }
    .mrg-arch-r { font-size: 12px; fill: var(--text, #dce5f2); }
    .mrg-arch-note { font-size: 12px; fill: var(--faint, #5f7089); }
    .mrg-arch-node { fill: var(--surface, #111a2c); stroke: var(--faint, #5f7089); stroke-width: 1.25; }
    .mrg-arch-hot { fill: var(--accent-soft, rgba(69, 214, 196, 0.12)); stroke: var(--accent, #45d6c4); stroke-width: 1.5; }
    .mrg-arch-caprule { stroke: var(--accent-line, rgba(69, 214, 196, 0.35)); stroke-width: 1; }
    .mrg-arch-flow { stroke: currentColor; stroke-width: 1.75; }
    .mrg-arch-back { stroke: currentColor; stroke-width: 1.25; fill: none; }
    .mrg-arch-rule { stroke: var(--border, #1e2a40); stroke-width: 1; }
    .mrg-arch-bracket { stroke: var(--border-strong, #2b3a57); stroke-width: 1; fill: none; }
  </style>

  <g>

  <line class="mrg-arch-flow" x1="537.7" y1="104" x2="551.1" y2="104" marker-end="url(#mrg-arch-arrow)"/>

  <line class="mrg-arch-flow" x1="760.6" y1="104" x2="774" y2="104" marker-end="url(#mrg-arch-arrow)"/>
  <path class="mrg-arch-back" d="M 269.4 141 L 269.4 178 L 149.4 178 L 149.4 141" marker-end="url(#mrg-arch-arrow)"/>

  <text class="mrg-arch-note" x="272.8" y="248" text-anchor="middle">synchronous decision + action — local and bounded (I3)</text>

</svg>

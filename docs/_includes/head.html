<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  {% if page.description %}
  <meta name="description" content="{{ page.description | escape }}">
  {% else %}
  <meta name="description" content="{{ site.description | escape }}">
  {% endif %}
  <link rel="canonical" href="{{ site.url }}{{ site.baseurl }}{{ page.url }}">
  <link rel="icon" href="{{ site.baseurl }}/assets/img/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/main.css">
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/search.css">
  <script>
    // Set the theme before first paint to avoid a flash of the wrong one.
    // Preference order: stored choice, then prefers-color-scheme.
    (function () {
      try {
        var stored = localStorage.getItem("mirage-theme");
        var dark = stored ? stored === "dark"
          : window.matchMedia("(prefers-color-scheme: light)").matches ? false : true;
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      } catch (e) { /* storage unavailable: keep the dark default */ }
    })();
  </script>
</head>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  {% if page.description %}
  <meta name="description" content="{{ page.description | escape }}">
  {% else %}
  <meta name="description" content="{{ site.description | escape }}">
  {% endif %}
  <link rel="canonical" href="{{ site.url }}{{ site.baseurl }}{{ page.url }}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ site.title }}">
  <!-- The landing page's own title is the site title; don't render it twice. -->
  {% if page.title and page.title != site.title %}
  <meta property="og:title" content="{{ page.title }} · {{ site.title }}">
  {% else %}
  <meta property="og:title" content="{{ site.title }}">
  {% endif %}
  {% if page.description %}
  <meta property="og:description" content="{{ page.description | escape }}">
  {% else %}
  <meta property="og:description" content="{{ site.description | escape }}">
  {% endif %}
  <meta property="og:url" content="{{ site.url }}{{ site.baseurl }}{{ page.url }}">
  <meta property="og:image" content="{{ site.url }}{{ site.baseurl }}/assets/img/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="The Mirage mark — nested teal diamonds on deep navy beside the MIRAGE wordmark.">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="{{ site.baseurl }}/assets/img/mark.svg" type="image/svg+xml">
  <link rel="icon" href="{{ site.baseurl }}/assets/img/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="{{ site.baseurl }}/assets/img/apple-touch-icon.png">
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/main.css">
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/hero.css">
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/search.css">
  <script>
    // Set the theme before first paint to avoid a flash of the wrong one.
    // Preference order: stored choice, then prefers-color-scheme.
    (function () {
      try {
        var stored = localStorage.getItem("mirage-theme");
        var dark = stored ? stored === "dark"
          : window.matchMedia("(prefers-color-scheme: light)").matches ? false : true;
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      } catch (e) { /* storage unavailable: keep the dark default */ }
    })();
  </script>
</head>
